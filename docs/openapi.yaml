          content:
            application/json: { schema: { $ref: '#/components/schemas/TransactionResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tax-rates:
    get:
      operationId: listTaxRates
