      responses:
        '200':
          description: Effective-dated tax rates in the authenticated branch
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates: { type: array, items: { $ref: '#/components/schemas/TaxRate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTaxRate
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaxRateUpsert' } }
      responses:
        '201': { description: Tax rate created, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tax-rates/{id}:
    patch:
      operationId: updateTaxRate
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaxRateUpsert' } }
      responses:
        '200': { description: Tax rate updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRate' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTaxRate
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
