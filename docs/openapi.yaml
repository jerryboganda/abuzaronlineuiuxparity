openapi: 3.1.0
info:
  title: Abuzar Next API
  version: 0.1.0
  description: Tenant-scoped central API for online and synchronized branch operations.
servers:
  - url: https://api.example.invalid
paths:
  /v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /v1/session:
    get:
      operationId: session
      security: []
      responses:
        '200':
          description: Current HTTP-only session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created; the response sets an HTTP-only cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticatedSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        '204': { description: Session cleared }
  /v1/tenants:
    get:
      operationId: listTenants
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Authenticated tenant
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/branches:
    get:
      operationId: listBranches
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Branches allowed by the authenticated operator
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/counters:
    get:
      operationId: listCounters
      security: [{ sessionCookie: [] }]
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Counters allowed by the authenticated operator
          content:
            application/json:
              schema:
                type: object
                required: [counters]
                properties:
                  counters: { type: array, items: { $ref: '#/components/schemas/Counter' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/access:
    get:
      operationId: currentAccess
      security: [{ sessionCookie: [] }]
      description: Effective normalized permissions plus imported legacy rights and scope rows. Unmapped right codes are reported as exceptions and are not claimed as exact command mappings.
      responses:
        '200':
          description: Effective access for the authenticated operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/roles:
    get:
      operationId: listRoles
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant groups and their permission sets
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRole
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpsert' }
      responses:
        '201':
          description: Created tenant group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/roles/{id}:
    patch:
      operationId: updateRole
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpsert' }
      responses:
        '200':
          description: Updated tenant group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/roles/{id}/rights:
    get:
      operationId: roleRights
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Imported rights and scopes for a tenant group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleRights' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRoleRights
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRightsUpdate' }
      responses:
        '200':
          description: Updated imported rights and scopes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleRights' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/operators:
    get:
      operationId: listOperators
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Operators visible in the authenticated operational scope
          content:
            application/json:
              schema:
                type: object
                required: [operators]
                properties:
                  operators: { type: array, items: { $ref: '#/components/schemas/Operator' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/operators/{id}:
    patch:
      operationId: updateOperator
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorUpdate' }
      responses:
        '200':
          description: Updated tenant-scoped operator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/items/lookup:
    get:
      operationId: lookupItems
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: alias, in: query, schema: { type: string } }
        - { name: barcode, in: query, schema: { type: string } }
        - { name: legacyId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Tenant-scoped item matches by name, alias, barcode, or legacy identifier
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ItemLookupResult' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/inventory/availability:
    get:
      operationId: getInventoryAvailability
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: itemLegacyId, in: query, required: true, schema: { type: string } }
        - { name: godownId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Active, non-expired stock batches for the selected tenant branch and godown
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, branchId, itemLegacyId, godownId, batches]
                properties:
                  tenantId: { type: string, format: uuid }
                  branchId: { type: string, format: uuid }
                  itemLegacyId: { type: string }
                  godownId: { type: string, format: uuid }
                  batches:
                    type: array
                    items:
                      type: object
                      required: [batchId, batchNumber, quantity, unitCost]
                      properties:
                        batchId: { type: string, format: uuid }
                        batchNumber: { type: string }
                        expiryDate: { type: string, format: date }
                        quantity: { type: string }
                        unitCost: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/master/{kind}:
    get:
      operationId: listCanonicalMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Tenant-scoped canonical master list
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records: { type: array, items: { $ref: '#/components/schemas/MasterRecord' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCanonicalMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MasterUpsert' } } }
      responses:
        '201':
          description: Created canonical master
          content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/master/{kind}/{id}:
    get:
      operationId: getCanonicalMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped canonical master detail
          content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCanonicalMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MasterUpsert' } } }
      responses:
        '200':
          description: Updated canonical master
          content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteCanonicalMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Canonical master deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/master/item/{id}/suppliers:
    get:
      operationId: listItemSuppliers
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped ItemSuppliers grid
          content:
            application/json:
              schema:
                type: object
                required: [suppliers]
                properties:
                  suppliers: { type: array, items: { $ref: '#/components/schemas/ItemSupplier' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemSuppliers
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suppliers]
              properties:
                suppliers: { type: array, items: { $ref: '#/components/schemas/ItemSupplier' } }
      responses:
        '200': { description: Replaced ItemSuppliers grid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/master/item/{id}/aliases:
    get:
      operationId: listItemAlternateAliases
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped alternate aliases for the Item Form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAlternateAliases' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemAlternateAliases
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemAlternateAliases' }
      responses:
        '200':
          description: Replaced only the item's alternate aliases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAlternateAliases' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/master/item/{id}/images:
    get:
      operationId: listItemImages
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped ItemImage collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemImages' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemImages
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemImages' }
      responses:
        '200':
          description: Replaced the selected item's image collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemImages' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/master/item/{id}/notes:
    get:
      operationId: getItemNotes
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped opaque ItemNotes blob
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemNotes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemNotes
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemNotes' }
      responses:
        '200':
          description: Replaced the selected item's opaque notes blob
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemNotes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/master/item/{id}/associations:
    get:
      operationId: listItemAssociations
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped ItemAssociation pairs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAssociations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemAssociations
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legacyItemIds]
              properties:
                legacyItemIds: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 160 } }
      responses:
        '200':
          description: Replaced the selected item's association pairs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAssociations' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/master/item/{id}/authors:
    get:
      operationId: listItemAuthors
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped ItemAuthor relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAuthors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemAuthors
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authors]
              properties:
                authors: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ItemAuthor' } }
      responses:
        '200':
          description: Replaced the selected item's author relationships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAuthors' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/master/item/{id}/models:
    get:
      operationId: listItemModels
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped ItemInModel membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemModels' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemModels
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelCodes]
              properties:
                modelCodes: { type: array, maxItems: 100, items: { type: integer, minimum: -32768, maximum: 32767 } }
      responses:
        '200':
          description: Replaced the selected item's model membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemModels' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/master/item/{id}/price-policy:
    get:
      operationId: getItemPricePolicy
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant-scoped PricePolicy header and PricePolicyDetail tiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPricePolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceItemPricePolicy
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyCode, tiers]
              properties:
                policyCode: { type: string, minLength: 1, maxLength: 160 }
                tiers: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ItemPricePolicyTier' } }
      responses:
        '200':
          description: Replaced the selected item's source-backed PricePolicyDetail tiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPricePolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/master/item/{id}/registration-request:
    get:
      operationId: getItemRegistrationRequest
