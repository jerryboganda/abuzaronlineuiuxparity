  /v1/tax-assignments:
    get:
      operationId: listTaxAssignments
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
        - { name: partyId, in: query, schema: { type: string, format: uuid } }
        - { name: effectiveAt, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Effective-dated item and party tax assignments
          content:
            application/json:
              schema:
                type: object
                required: [items, parties]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaxAssignment' } }
                  parties: { type: array, items: { $ref: '#/components/schemas/TaxAssignment' } }
  /v1/tax-assignments/items/{itemId}:
    put:
      operationId: replaceItemTaxAssignments
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaxAssignmentReplace' } }
      responses:
        '200': { description: Item tax assignments replaced }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tax-assignments/parties/{partyId}:
    put:
      operationId: replacePartyTaxAssignments
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/TaxAssignmentReplace' } }
      responses:
        '200': { description: Party tax assignments replaced }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tax-assignments/apply-item-gst:
    post:
      operationId: applyItemGST
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ApplyItemGST' } }
      responses:
        '200': { description: GST assignment applied to the selected or all active canonical items }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/documents/{kind}:
    post:
      operationId: commandBusinessDocument
      description: |
        Commands cash/credit sales, cash/credit sale returns, quotations, refused sales,
        and the Phase I purchase families:
        pack-purchase, loose-purchase, opening-purchase, purchase-return, and
        purchase-order. Sale returns require a posted source sale and restore its
        source batches before reversing finance projections. Save, post,
        save-and-post, void, and draft delete are idempotent by
        commandId/idempotencyKey and use optimistic document revisions. Delete
        is a non-destructive, audited soft-delete limited to draft documents;
        posted documents must use void/reversal semantics.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/DocumentKind' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCommand' }
      responses:
        '200':
          description: Document command accepted or replayed from an idempotent receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCommandResult' }
        '201':
          description: New draft document saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/documents/{id}:
    get:
      operationId: getBusinessDocument
      description: Read one canonical business document, including its persisted lines, pricing snapshot, stock allocations, and finance summary, within the authenticated tenant and branch.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Canonical business document detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/shifts/open:
    post:
      operationId: openShift
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string }
      responses:
        '201': { description: Shift opened }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shifts/{id}/close:
    post:
      operationId: closeShift
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string }
      responses:
        '200': { description: Shift closed }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sync/push:
    post:
      operationId: pushSync
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/SyncEnvelope' } }
      responses:
        '202':
          description: Batch result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBatchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/sync/pull:
    get:
      operationId: pullSync
      security: [{ sessionCookie: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Server-authoritative event page
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/SyncEnvelope' } }
                  nextCursor: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/conflicts:
    get:
      operationId: listConflicts
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Conflict review queue
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts: { type: array, items: { $ref: '#/components/schemas/ConflictRecord' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/conflicts/{id}/resolve:
    post:
      operationId: resolveConflict
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, dismissed] }
                resolution: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Conflict status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictResolutionResult' }
        '400': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conflict not found }
  /v1/finance/ledger:
    get:
      operationId: financeLedger
      security: [{ sessionCookie: [] }]
      parameters:
        - name: partyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Party ledger entries including source-backed historical payment allocations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceLedgerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: abuzar_session
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Conflict:
      description: Idempotency conflict
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    BadRequest:
      description: Request validation failed
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: Authenticated operator lacks the required tenant-admin permission
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: Resource not found in the authenticated tenant scope
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unavailable:
      description: Database or identity store unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    UnprocessableEntity:
      description: The command was well-formed but failed canonical, lifecycle, stock, or finance validation
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    LoginRequest:
      type: object
      required: [username, password, tenantCode]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
        tenantCode: { type: string, minLength: 1 }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
    TenantContext:
      type: object
      required: [operatorId, displayName, tenantId, tenantCode, roles, permissions]
      properties:
        operatorId: { type: string, format: uuid }
        displayName: { type: string }
        tenantId: { type: string, format: uuid }
        tenantCode: { type: string }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    SessionResponse:
      type: object
      required: [authenticated, context]
      properties:
        authenticated: { type: boolean }
        context: { anyOf: [{ $ref: '#/components/schemas/TenantContext' }, { type: 'null' }] }
    AuthenticatedSession:
      type: object
      required: [authenticated, context, expiresAt]
      properties:
        authenticated: { const: true }
        context: { $ref: '#/components/schemas/TenantContext' }
        expiresAt: { type: string, format: date-time }
    Tenant:
      type: object
      required: [id, code, legalName, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legalName: { type: string }
        active: { type: boolean }
    Branch:
      type: object
      required: [id, code, name, timezone, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timezone: { type: string }
        active: { type: boolean }
    Counter:
      type: object
      required: [id, branchId, code, name, active]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
    Role:
      type: object
      required: [id, code, name, memberCount, permissions]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        memberCount: { type: integer, minimum: 0 }
        permissions: { type: array, items: { type: string } }
    RoleUpsert:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        permissions: { type: array, uniqueItems: true, items: { type: string } }
    LegacyRight:
      type: object
      required: [rightCode, allowed, mapping]
      properties:
        rightCode: { type: string }
        permission: { type: string }
        allowed: { type: boolean }
        legacyStatus: { type: string }
        mapping: { type: string, enum: [explicit, ambiguous] }
    LegacyScope:
      type: object
      required: [scopeKind, scopeKey, allowed]
      properties:
        scopeKind: { type: string }
        scopeKey: { type: string }
        scopeLabel: { type: string }
        allowed: { type: boolean }
        legacyTable: { type: string }
    AccessResponse:
      type: object
      required: [tenantAdmin, permissions, legacyRights, scopes, scopeRows, exceptions]
      properties:
        tenantAdmin: { type: boolean }
        permissions: { type: array, items: { type: string } }
        legacyRights: { type: array, items: { $ref: '#/components/schemas/LegacyRight' } }
        scopes: { type: object, additionalProperties: { type: object, additionalProperties: { type: boolean } } }
        scopeRows: { type: array, items: { $ref: '#/components/schemas/LegacyScope' } }
        exceptions: { type: array, items: { type: string } }
    RoleRights:
      type: object
      required: [roleId, permissions, legacyRights, scopes]
      properties:
        roleId: { type: string, format: uuid }
        permissions: { type: array, items: { type: string } }
        legacyRights: { type: array, items: { $ref: '#/components/schemas/LegacyRight' } }
        scopes: { type: array, items: { $ref: '#/components/schemas/LegacyScope' } }
    RoleRightsUpdate:
      type: object
      properties:
        permissions: { type: array, uniqueItems: true, items: { type: string } }
        legacyRights:
          type: array
          items:
            type: object
            required: [rightCode, allowed]
            properties:
              rightCode: { type: string }
              allowed: { type: boolean }
        scopes:
          type: array
          items:
            type: object
            required: [scopeKind, scopeKey, allowed]
            properties:
              scopeKind: { type: string }
              scopeKey: { type: string }
              allowed: { type: boolean }
    Operator:
      type: object
      required: [id, username, displayName, active, roles]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        active: { type: boolean }
        roles: { type: array, items: { type: string } }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
    OperatorUpdate:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        password: { type: string, minLength: 8, maxLength: 256 }
        active: { type: boolean }
        roleCode: { type: string, maxLength: 80 }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
    SyncEnvelope:
      type: object
      required: [eventId, aggregate, aggregateId, tenantId, branchId, counterId, operatorId, occurredAt, idempotencyKey, schemaVersion, payload]
      properties:
        eventId: { type: string, format: uuid }
        aggregate: { type: string }
        aggregateId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
        schemaVersion: { type: integer, minimum: 1 }
        payload: { type: object, additionalProperties: true }
    SyncBatchResult:
      type: object
      required: [accepted, duplicates, conflicts]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
    TransactionResult:
      type: object
      required: [accepted, duplicate, eventId, aggregateId]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        eventId: { type: string, format: uuid }
        aggregateId: { type: string, format: uuid }
    ConflictRecord:
      type: object
      required: [id, entityType, entityId, tenantId, branchId, status, localValue, serverValue, createdAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        status: { type: string, enum: [open, resolved, dismissed] }
        localValue: { type: object, additionalProperties: true }
        serverValue: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ConflictResolutionResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [resolved, dismissed] }
    MasterRecord:
      type: object
      required: [id, kind, code, name, payload, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        legacyId: { type: string }
        code: { type: string }
        name: { type: string }
        payload: { type: object, additionalProperties: true }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        suppliers: { type: array, items: { $ref: '#/components/schemas/ItemSupplier' } }
    MasterUpsert:
      type: object
      properties:
        legacyId: { type: string, maxLength: 160 }
        code: { type: string, maxLength: 160 }
        name: { type: string, maxLength: 240 }
        payload: { type: object, additionalProperties: true }
        active: { type: boolean }
    ItemAlternateAliases:
      type: object
      required: [aliases]
      properties:
        aliases:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 160 }
    ItemImages:
      type: object
      required: [images]
      properties:
        images:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemImage' }
    ItemImage:
      type: object
      required: [rowId, imageDescription, imageData, imageType]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        rowId: { type: integer, minimum: 1 }
        imageDescription: { type: string, maxLength: 240 }
        imageData: { type: string, description: Base64-encoded image blob, maxLength: 8388608 }
        imageType: { type: string, maxLength: 100 }
    ItemNotes:
      type: object
      required: [notesData]
      properties:
        notesData:
          type: string
          description: Base64-encoded bytes from dbo.ItemNotes. Empty means no notes; decoded size is bounded to 8 MiB.
          maxLength: 11184812
    ItemAssociations:
      type: object
      required: [associations]
      properties:
        associations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ItemAssociation' }
    ItemAssociation:
      type: object
      required: [legacyItemId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legacyItemId: { type: string, maxLength: 160 }
        code: { type: string, readOnly: true }
        name: { type: string, readOnly: true }
    ItemAuthors:
      type: object
      required: [authors]
      properties:
        authors:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemAuthor' }
    ItemAuthor:
      type: object
      required: [authorCode, priority, rowId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        authorCode: { type: integer, minimum: 1 }
        priority: { type: integer, minimum: 0, maximum: 255 }
        rowId: { type: integer, minimum: 1 }
    ItemModels:
      type: object
      required: [models]
      properties:
        models:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ItemModel' }
    ItemModel:
      type: object
      required: [modelCode]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        modelCode: { type: integer, minimum: -32768, maximum: 32767 }
    ItemPricePolicy:
      type: object
      required: [policy, tiers]
      properties:
        policy:
          anyOf:
            - $ref: '#/components/schemas/ItemPricePolicyHeader'
            - type: 'null'
        tiers:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ItemPricePolicyTier' }
    ItemPricePolicyHeader:
      type: object
      required: [policyCode, name, legacyItemId]
      properties:
        policyCode: { type: string }
        name: { type: string }
        legacyItemId: { type: string }
    ItemPricePolicyTier:
      type: object
      required: [quantityLimit, price, expiryDate, flatDiscount, discountPercent]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        quantityLimit: { type: integer }
        price: { type: string, description: Exact decimal source Price value, maxLength: 64 }
        expiryDate: { type: string, description: ISO date; empty means no target date, maxLength: 10 }
        flatDiscount: { type: string, description: Exact decimal source ItemFlatDisc value, maxLength: 64 }
        discountPercent: { type: string, description: Exact decimal source DiscPerc value, maxLength: 64 }
    ItemRegistrationRequestResponse:
      type: object
      required: [request]
      properties:
        request:
          anyOf:
            - $ref: '#/components/schemas/ItemRegistrationRequest'
            - type: 'null'
    ItemRegistrationRequest:
      type: object
      required: [id, requestCode, legacyItemId, requestedAt, serverName, machineName, sent, sentOn, payload]
      properties:
        id: { type: string, format: uuid }
        requestCode: { type: integer }
        legacyItemId: { type: string }
        requestedAt: { type: string, format: date-time }
        serverName: { type: string }
        machineName: { type: string }
        sent: { type: string, enum: [Y, N] }
        sentOn: { type: string }
        sentBy: { type: integer }
        serverRequestCode: { type: integer }
        payload: { type: object, additionalProperties: true, description: Source-shaped ItemRegRequest fields preserved from the item payload }
    ItemUnpostedTransactions:
      type: object
      required: [itemId, transactions, truncated]
      properties:
        itemId: { type: string, format: uuid }
        transactions:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ItemUnpostedTransaction' }
        truncated: { type: boolean, description: True when more than 200 canonical draft lines matched }
    ItemUnpostedTransaction:
      type: object
      required: [id, kind, documentNumber, status, occurredAt, lineNumber, itemLegacyId, itemName, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        documentNumber: { type: string }
        status: { type: string, enum: [draft] }
        occurredAt: { type: string, format: date-time }
        lineNumber: { type: integer, minimum: 1 }
        itemLegacyId: { type: string }
        itemName: { type: string }
        quantity: { type: string }
        unitPrice: { type: string }
        lineTotal: { type: string }
    ItemSupplier:
      type: object
      required: [legacySupplierId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        legacySupplierId: { type: string }
        supplierId: { type: string, format: uuid }
        priority: { type: integer }
        rate: { type: string }
        discountPercent: { type: string }
        quantity: { type: string }
        bonus: { type: string }
        days: { type: integer }
    ItemLookupResult:
      type: object
      required: [id, legacyId, code, name, payload, active, aliases]
      properties:
        id: { type: string, format: uuid }
        legacyId: { type: string }
        code: { type: string }
        name: { type: string }
        payload: { type: object, additionalProperties: true }
        active: { type: boolean }
        aliases: { type: array, items: { type: string } }
    TaxRate:
      type: object
      required: [id, tenantId, branchId, taxKind, code, name, rate, inclusive, effectiveFrom, active]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        taxKind: { type: string, enum: [gst, pct, advance] }
        code: { type: string }
        name: { type: string }
        rate: { type: string }
        inclusive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        sourceTable: { type: string }
        sourceLegacyId: { type: string }
        active: { type: boolean }
    TaxRateUpsert:
      type: object
      required: [taxKind, code, name, rate, effectiveFrom]
      properties:
        taxKind: { type: string, enum: [gst, pct, advance] }
        code: { type: string }
        name: { type: string }
        rate: { type: string }
        inclusive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        sourceTable: { type: string }
        sourceLegacyId: { type: string }
        active: { type: boolean }
    TaxAssignment:
      type: object
      required: [id, targetKind, taxRate, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        targetKind: { type: string, enum: [item, party] }
        itemId: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        sourceTable: { type: string }
        sourceLegacyId: { type: string }
    TaxAssignmentReplace:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          maxItems: 20
          items:
            type: object
            required: [taxRateId, effectiveFrom]
            properties:
              taxRateId: { type: string, format: uuid }
              effectiveFrom: { type: string, format: date }
              effectiveTo: { type: string, format: date }
              sourceTable: { type: string }
              sourceLegacyId: { type: string }
    ApplyItemGST:
      type: object
      required: [effectiveFrom]
      properties:
        rateId: { type: string, format: uuid }
        rate: { type: string }
        inclusive: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        itemIds: { type: array, items: { type: string, format: uuid } }
        sourceTable: { type: string }
        sourceLegacyId: { type: string }
    DocumentCommand:
      type: object
      description: |
        Lifecycle command for a sale or purchase document. Save creates or
        revises a draft; post transitions an existing draft to posted;
        save-and-post creates and posts atomically. Delete soft-deletes only
        drafts and preserves the canonical row for audit/revision/event history.
        Void is supported for
        drafts and stock/GL-neutral purchase orders, and for canonical posted
        sales, purchases, and returns when completed projections exist; those
        posted voids append compensating stock/GL/party-ledger projections in
        the same transaction and reject posted dependents. Open returns
        intentionally omit a source invoice.
      required: [commandId, kind, action, idempotencyKey, occurredAt]
      properties:
        commandId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        action: { $ref: '#/components/schemas/DocumentAction' }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        occurredAt: { type: string, format: date-time }
        expectedVersion: { type: integer, minimum: 1 }
        document:
          $ref: '#/components/schemas/DocumentDraft'
        documentId: { type: string, format: uuid }
        reason: { type: string }
    DocumentDraft:
      type: object
      required: [kind, occurredAt, lines]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        documentNumber: { type: string }
        occurredAt: { type: string, format: date-time }
        customerId: { type: string, format: uuid }
        supplierId:
          type: string
          format: uuid
          description: Required for pack, loose, opening, return, and purchase-order documents.
        sourceDocumentId:
          type: string
          format: uuid
          description: Required when posting a source-bound purchase or sale return; open sale returns must omit it and use an explicit godown.
        sourceDocumentNumber: { type: string }
        godownId: { type: string, format: uuid }
        reference: { type: string }
        remarks: { type: string }
        creditDays:
          type: string
          description: Whole supplier credit term in days for purchase documents; bounded by the server to -36500 through 36500.
        dueDate:
          type: string
          format: date
          description: SaleLedger-compatible due date for credit-sale documents; retained for receivables aging.
        voidReason: { type: string }
        priceLevel: { type: integer, minimum: 1, maximum: 10 }
        flatDiscountAmount: { type: string }
        miscAmount: { type: string }
        documentDiscountPercent: { type: string }
        pricing: { $ref: '#/components/schemas/DocumentPricing' }
        payment: { $ref: '#/components/schemas/DocumentPayment' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DocumentLineDraft' }
    DocumentLineDraft:
      type: object
      required: [lineNumber, itemId, quantity]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        itemId: { type: string, format: uuid }
        sourceLineId:
          type: string
          format: uuid
          description: Required on every posted closed cash/credit sale-return and purchase-return line and must belong to sourceDocumentId.
        quantity: { type: string }
        unitPrice: { type: string }
        discountPercent: { type: string }
        supplierScheme: { type: object, additionalProperties: true }
        allocations:
          type: array
          description: Required on posted purchase returns; each allocation must identify a valid source batch.
          items: { $ref: '#/components/schemas/BatchAllocationRequest' }
        batchNumber:
          type: string
          description: Required when posting pack, loose, or opening purchases and open sale returns. No automatic batch number is generated.
        expiryDate: { type: string, format: date }
        unitCost:
          type: string
          description: Required when posting pack, loose, or opening purchases.
        gstRate: { type: string, description: Optional GST metadata retained on the purchase line. }
        pctRate: { type: string, description: Optional PCT metadata retained on the purchase line. }
        advanceTaxRate: { type: string, description: Optional advance-tax metadata retained on the purchase line. }
        notes: { type: string }
    BatchAllocationRequest:
      type: object
      required: [quantity]
      properties:
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        quantity: { type: string }
    DocumentPricing:
      type: object
      properties:
        priceLevel: { type: integer, minimum: 1, maximum: 10 }
        groupDiscountPercent: { type: string }
        customerDiscountPercent: { type: string }
        overrideDiscountPercent: { type: string }
        documentDiscountPercent: { type: string }
        flatDiscountAmount: { type: string }
        miscAmount: { type: string }
        taxes: { $ref: '#/components/schemas/DocumentTaxInputs' }
    DocumentPayment:
      type: object
      required: [mode, received, tendered, change]
      properties:
        mode: { type: string, enum: [cash] }
        received: { type: string }
        tendered: { type: string }
        change: { type: string }
        accountCode: { type: string }
    DocumentTaxInputs:
      type: object
      properties:
        gst: { $ref: '#/components/schemas/DocumentTaxInput' }
        pct: { $ref: '#/components/schemas/DocumentTaxInput' }
        advanceTax: { $ref: '#/components/schemas/DocumentTaxInput' }
    DocumentTaxInput:
      type: object
      required: [rate]
      properties:
        rate: { type: string }
        inclusive: { type: boolean, default: false }
    DocumentKind:
      type: string
      description: Supported canonical sale, source-bound return, open-return, and Phase I purchase document families.
      enum:
        - cash-sale
        - credit-sale
        - cash-return
        - credit-return
        - open-cash-return
        - open-credit-return
        - quotation
        - refused-sale
        - pack-purchase
        - loose-purchase
        - opening-purchase
        - purchase-return
        - purchase-order
    DocumentAction:
      type: string
      enum: [save, post, save-and-post, void, delete]
    DocumentStatus:
      type: string
      enum: [draft, posted, void]
    DocumentCommandResult:
      type: object
      required: [accepted, duplicate, eventId, aggregateId, kind, action, status, document]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        eventId: { type: string, format: uuid, description: Immutable sync_events event ID; not the command-receipt ID }
        aggregateId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        action: { $ref: '#/components/schemas/DocumentAction' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        document: { $ref: '#/components/schemas/BusinessDocument' }
        errors: { type: array, items: { $ref: '#/components/schemas/DocumentCommandError' } }
    DocumentCommandError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: string }
    BusinessDocument:
      type: object
      description: |
        Canonical lifecycle response. Purchase orders are stock/GL-neutral
        even when posted. Pack, loose, and opening purchases post stock-in and
        supplier payable/input-tax projections. Purchase returns post stock-out
        and payable/input-tax reversal only against a valid source batch. Source-
        bound sale returns restore source allocations; open sale returns receive
        into an explicit godown without a source invoice.
      required: [id, kind, status, documentNumber, tenantId, branchId, counterId, operatorId, occurredAt, lines, totals, version]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        documentNumber: { type: string }
        tenantId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        counterId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        customerId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        sourceDocumentId: { type: string, format: uuid }
        sourceDocumentNumber: { type: string }
        godownId: { type: string, format: uuid }
        reference: { type: string }
        remarks: { type: string }
        creditDays: { type: string, description: Retained supplier credit term in days for purchase aging. }
        dueDate: { type: string, format: date, description: Retained SaleLedger due date for credit-sale receivables aging. }
        voidReason: { type: string }
        deletedAt: { type: string, format: date-time, description: Present when an audited draft delete has soft-deleted the document from normal reads. }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
        totals: { $ref: '#/components/schemas/DocumentTotals' }
        payment: { $ref: '#/components/schemas/DocumentPayment' }
        pricing: { type: object, additionalProperties: true }
        finance: { $ref: '#/components/schemas/DocumentFinanceSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    DocumentLine:
      type: object
      required: [id, lineNumber, itemId, itemCode, itemName, quantity, price, tax, lineTotal, stock]
      properties:
        id: { type: string, format: uuid }
        lineNumber: { type: integer }
        itemId: { type: string, format: uuid }
        sourceLineId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        quantity: { type: string }
        price: { $ref: '#/components/schemas/DocumentPrice' }
        tax: { $ref: '#/components/schemas/DocumentTaxSummary' }
        itemLegacyId: { type: string }
        batchNumber: { type: string }
        expiryDate: { type: string, format: date }
        unitCost: { type: string }
        taxAmount: { type: string }
        allocations: { type: array, items: { $ref: '#/components/schemas/BatchAllocation' } }
        lineTotal: { type: string }
        stock:
          type: object
          required: [direction, quantity]
          properties:
            direction: { type: string, enum: [in, out, none] }
            quantity: { type: string }
    DocumentTaxSummary:
      type: object
      required: [taxableAmount, amount, lines]
      properties:
        taxableAmount: { type: string }
        amount: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentTax' } }
    DocumentTax:
      type: object
      required: [rate, taxableAmount, amount]
      properties:
        kind: { type: string }
        rate: { type: string }
        taxableAmount: { type: string }
        amount: { type: string }
    DocumentPrice:
      type: object
      required: [unitPrice, grossAmount, discountPercent, discountAmount, netAmount]
      properties:
        priceTier: { type: integer, minimum: 1, maximum: 10 }
        unitPrice: { type: string }
        grossAmount: { type: string }
        discountPercent: { type: string }
        discountAmount: { type: string }
        netAmount: { type: string }
    BatchAllocation:
      type: object
      required: [batchNumber, quantity]
      properties:
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        expiryDate: { type: string, format: date }
        godownId: { type: string, format: uuid }
        quantity: { type: string }
        unitCost: { type: string }
    DocumentFinanceSummary:
      type: object
      required: [journalId, debitTotal, creditTotal, balanced]
      properties:
        journalId: { type: string, format: uuid }
        debitTotal: { type: string }
        creditTotal: { type: string }
        balanced: { type: boolean }
        partyLedgerEntryId: { type: string, format: uuid }
        partyBalanceAfter: { type: string }
    FinanceLedgerEntry:
      type: object
      required: [id, documentId, debit, credit, occurredAt, description]
      properties:
        id: { type: string }
        documentId: { type: string }
        debit: { type: string }
        credit: { type: string }
        balanceAfter: { type: string }
        occurredAt: { type: string, format: date-time }
        description: { type: string }
        sourceType: { type: string, enum: [party-ledger, payment-allocation, receivable-adjustment, return-allocation] }
    FinanceLedgerResponse:
      type: object
      required: [partyId, balance, entries]
      properties:
        partyId: { type: string, format: uuid }
        balance: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/FinanceLedgerEntry' } }
    DocumentTotals:
      type: object
      required: [subtotal, discountAmount, miscAmount, taxAmount, totalAmount, paidAmount, balanceAmount]
      properties:
        subtotal: { type: string }
        discountAmount: { type: string }
        miscAmount: { type: string }
        taxAmount: { type: string }
        totalAmount: { type: string }
        paidAmount: { type: string }
        balanceAmount: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
